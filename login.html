<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register — Kirti Pharma</title>
  <meta name="description" content="Login to your Kirti Pharma account. Access medicine orders, prescription history, and fast Gondia delivery.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="stylesheet" href="css/components.css?v=2">
  <link rel="stylesheet" href="css/responsive.css?v=2">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: url('images/bg.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,35,20,0.72) 0%, rgba(15,23,42,0.65) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 0;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 40px 36px 32px;
      box-shadow: 0 32px 64px rgba(0,0,0,0.28), 0 0 0 1px rgba(255,255,255,0.6) inset;
      animation: slideUp 0.35s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .logo-wrap { display: flex; align-items: center; justify-content: center; margin-bottom: 26px; }
    .logo-wrap img { height: 52px; object-fit: contain; }

    .login-title { text-align: center; margin-bottom: 26px; }
    .login-title h1 { font-size: 1.45rem; font-weight: 800; color: #0f172a; letter-spacing: -0.3px; margin-bottom: 6px; }
    .login-title p  { font-size: 0.84rem; color: #64748b; line-height: 1.5; }

    .auth-tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 22px;
    }
    .auth-tab {
      flex: 1; padding: 10px; border: none; border-radius: 9px;
      font-size: 13.5px; font-weight: 700; font-family: inherit;
      cursor: pointer; background: transparent; color: #64748b;
      transition: all 0.2s ease;
    }
    .auth-tab.active {
      background: #006642; color: #fff;
      box-shadow: 0 4px 14px rgba(0,102,66,0.3);
    }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12.5px; font-weight: 600; color: #374151; margin-bottom: 7px; }
    .field-wrap { position: relative; display: flex; align-items: center; }
    .field-prefix { position: absolute; left: 14px; font-size: 14px; font-weight: 700; color: #64748b; pointer-events: none; }
    .field input {
      width: 100%; padding: 12px 14px;
      font-size: 15px; font-family: inherit; color: #0f172a;
      background: #f8fafc; border: 1.5px solid #e2e8f0;
      border-radius: 11px; outline: none;
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
    }
    .field input.with-prefix { padding-left: 46px; }
    .field input.with-suffix { padding-right: 46px; }
    .field input:focus { border-color: #006642; background: #fff; box-shadow: 0 0 0 3.5px rgba(0,102,66,0.13); }
    .field input::placeholder { color: #94a3b8; font-size: 14px; }

    .pw-toggle {
      position: absolute; right: 13px;
      background: none; border: none; cursor: pointer;
      font-size: 17px; color: #94a3b8; line-height: 1;
      padding: 4px; display: flex; align-items: center;
      transition: color 0.15s;
    }
    .pw-toggle:hover { color: #475569; }

    .btn-login {
      width: 100%; padding: 14px; margin-top: 4px;
      font-size: 15.5px; font-weight: 700; font-family: inherit;
      border-radius: 12px;
      background: linear-gradient(135deg, #006642 0%, #00854f 100%);
      color: #fff; border: none; cursor: pointer;
      letter-spacing: 0.01em;
      box-shadow: 0 6px 20px rgba(0,102,66,0.3);
      transition: opacity 0.2s, transform 0.12s, box-shadow 0.2s;
    }
    .btn-login:hover  { opacity: 0.92; box-shadow: 0 8px 26px rgba(0,102,66,0.38); }
    .btn-login:active { transform: scale(0.985); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .helper-text { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 14px; line-height: 1.5; }
    .helper-text strong { color: #64748b; }

    .db-badge {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 11.5px; font-weight: 600; color: #059669;
      background: #ecfdf5; border: 1px solid #a7f3d0;
      padding: 5px 12px; border-radius: 20px; margin-top: 22px;
    }
    .db-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #10b981; flex-shrink: 0;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%  { box-shadow: 0 0 0 0 rgba(16,185,129,0.7); }
      70% { box-shadow: 0 0 0 5px rgba(16,185,129,0); }
      100%{ box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }

    .back-link { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: #006642; font-weight: 600; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-6px); }
      40%,80%  { transform: translateX(6px); }
    }
    .shake { animation: shake 0.35s ease; }

    #toast-container {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%); z-index: 9999;
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="login-card">

  <!-- Logo -->
  <div class="logo-wrap">
    <a href="index.html" title="Back to Kirti Pharma">
      <img src="images/kirti-logo.png" alt="Kirti Pharma">
    </a>
  </div>

  <!-- Title -->
  <div class="login-title">
    <h1 id="card-title">Welcome Back</h1>
    <p id="card-sub">Enter your mobile number &amp; password to continue.</p>
  </div>

  <!-- Login / Register Tabs -->
  <div class="auth-tabs" role="tablist">
    <button class="auth-tab active" id="tab-login" onclick="switchTab('login')" role="tab">🔐 Login</button>
    <button class="auth-tab" id="tab-register" onclick="switchTab('register')" role="tab">✨ Register</button>
  </div>

  <!-- Full Name (Register tab only) -->
  <div class="field" id="name-field" style="display:none;">
    <label for="input-name">Full Name</label>
    <div class="field-wrap">
      <input type="text" id="input-name" placeholder="e.g. Ramesh Patel" autocomplete="name">
    </div>
  </div>

  <!-- Mobile Number -->
  <div class="field">
    <label for="input-phone">Mobile Number</label>
    <div class="field-wrap">
      <span class="field-prefix">+91</span>
      <input type="tel" id="input-phone" class="with-prefix" placeholder="10-digit number" maxlength="10" inputmode="numeric" autocomplete="tel">
    </div>
  </div>

  <!-- Password -->
  <div class="field">
    <label for="input-password">Password</label>
    <div class="field-wrap">
      <input type="password" id="input-password" class="with-suffix" placeholder="Minimum 4 characters" autocomplete="current-password">
      <button type="button" class="pw-toggle" id="pw-toggle-btn" onclick="togglePw()" title="Show / hide password">👁</button>
    </div>
  </div>

  <!-- Submit -->
  <button type="button" class="btn-login" id="btn-submit" onclick="doAuth()">Login</button>

  <p class="helper-text" id="helper-msg">
    New here? Switch to <strong>Register</strong> to create your account.
  </p>

  <!-- DB Status -->
  <div style="text-align:center;">
    <div class="db-badge">
      <span class="db-dot"></span>
      <span>Connected to Supabase PostgreSQL</span>
    </div>
  </div>

  <a href="index.html" class="back-link">← Return to Store</a>

</div>

<div id="toast-container"></div>

<script src="js/app.js"></script>
<script>
let activeTab = 'login';

function switchTab(tab) {
  activeTab = tab;
  const isReg = tab === 'register';
  document.getElementById('tab-login').classList.toggle('active', !isReg);
  document.getElementById('tab-register').classList.toggle('active', isReg);
  document.getElementById('name-field').style.display = isReg ? 'block' : 'none';
  document.getElementById('card-title').textContent = isReg ? 'Create Account' : 'Welcome Back';
  document.getElementById('card-sub').textContent   = isReg
    ? 'Fill in your details to get started.'
    : 'Enter your mobile number & password to continue.';
  document.getElementById('btn-submit').textContent = isReg ? 'Create Account' : 'Login';
  document.getElementById('helper-msg').innerHTML   = isReg
    ? 'Already have an account? Switch to <strong>Login</strong>.'
    : 'New here? Switch to <strong>Register</strong> to create your account.';
  ['input-name','input-phone','input-password'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('input-phone').focus();
}

function togglePw() {
  const pw  = document.getElementById('input-password');
  const btn = document.getElementById('pw-toggle-btn');
  const hidden = pw.type === 'password';
  pw.type         = hidden ? 'text' : 'password';
  btn.textContent = hidden ? '🙈' : '👁';
}

function shakeField(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
}

async function doAuth() {
  const phoneEl = document.getElementById('input-phone');
  const pwEl    = document.getElementById('input-password');
  const nameEl  = document.getElementById('input-name');
  const btn     = document.getElementById('btn-submit');

  const phone    = (phoneEl.value || '').replace(/\D/g, '').trim();
  const password = (pwEl.value   || '').trim();
  const name     = nameEl ? (nameEl.value || '').trim() : '';

  if (!/^\d{10}$/.test(phone)) {
    showToast('Please enter a valid 10-digit mobile number', 'error');
    shakeField('input-phone'); phoneEl.focus(); return;
  }
  if (password.length < 4) {
    showToast('Password must be at least 4 characters', 'error');
    shakeField('input-password'); pwEl.focus(); return;
  }
  if (activeTab === 'register' && !name) {
    showToast('Please enter your full name', 'error');
    shakeField('input-name'); nameEl.focus(); return;
  }

  btn.disabled    = true;
  btn.textContent = 'Please wait\u2026';

  try {
    const res  = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, password, name })
    });
    const data = await res.json();

    if (!data.success || !data.user) {
      showToast(data.error || 'Login failed. Please check your credentials.', 'error');
      btn.disabled    = false;
      btn.textContent = activeTab === 'register' ? 'Create Account' : 'Login';
      return;
    }

    const user = data.user;
    localStorage.setItem('kp_logged_in',       'true');
    localStorage.setItem('kp_user_phone',       user.phone);
    localStorage.setItem('kp_user_name',        user.name);
    localStorage.setItem('kp_user_role',        user.role);
    if (data.token)     localStorage.setItem('kp_token',          data.token);
    if (user.addresses) localStorage.setItem('kp_user_addresses', JSON.stringify(user.addresses));

    if (user.role === 'admin') {
      showToast('\uD83E\uDDD1\u200D\u2695\uFE0F Welcome, ' + user.name + '! Opening Dashboard\u2026', 'success', 2000);
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    } else {
      showToast('\u2705 Welcome, ' + user.name + '!', 'success', 2000);
      setTimeout(() => { window.location.href = 'index.html'; }, 800);
    }
  } catch (err) {
    showToast('Connection error. Please try again.', 'error');
    btn.disabled    = false;
    btn.textContent = activeTab === 'register' ? 'Create Account' : 'Login';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  ['input-name','input-phone','input-password'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
  });
});
</script>
</body>
</html>
